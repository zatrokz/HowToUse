<style>
/* Layout: egyoszlopos mobil nézet, max 440px széles "telefon" oszlop; alsó tabsor; nézetek hash-routinggal. */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171c; --surface:#172229; --fg:#e8eef2; --muted:#98a8b2; --line:#2a3842;
  --accent:#4fc1d0; --accent-fg:#06252b; --accent-soft:#143a41;
  --warn:#f0a062; --warn-soft:#3b2a1a; --ok:#6fcf97; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171c; --surface:#172229; --fg:#e8eef2; --muted:#98a8b2; --line:#2a3842;
  --accent:#4fc1d0; --accent-fg:#06252b; --accent-soft:#143a41;

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5;

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--font-head);text-wrap:balance;margin:0;line-height:1.2}
.app{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px 8px}
.top h1{font-size:1.15rem;flex:1;min-width:0}
.back{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;width:40px;height:40px;font-size:1.2rem;cursor:pointer}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{border:0;background:var(--surface);color:var(--muted);padding:8px 10px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
main{flex:1;padding-bottom:88px;display:flex;flex-direction:column;gap:16px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;outline:none}
.search input:focus-visible{outline:2px solid var(--accent);border-radius:4px}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;color:var(--fg);font:inherit;min-height:96px}
.tile:hover,.row:hover{border-color:var(--accent)}
.tile .ic{font-size:1.5rem;line-height:1}
.tile b{font-size:.95rem}
.tile small,.row small,.meta{color:var(--muted);font-size:.8rem}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;color:var(--fg);font:inherit;text-align:left;width:100%}

.row .t{flex:1;min-width:0}
.row b{display:block}
.chev{color:var(--muted)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:10px;padding:6px 10px;font:inherit;font-size:.85rem;font-weight:600;text-decoration:none;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.topic{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;color:var(--fg);font:inherit;text-align:left;width:100%}
.topic .n{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-family:var(--font-head);flex:none}
.topic.risk .n{background:var(--warn-soft);color:var(--warn)}
.topic .t{flex:1;min-width:0}
.topic b{display:block}
.topic.empty{opacity:.55;cursor:default}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--accent-soft);color:var(--ok)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.video{aspect-ratio:16/9;max-width:100%;border-radius:10px;background:linear-gradient(135deg,var(--accent-soft),var(--line));display:grid;place-items:center;text-align:center;color:var(--muted);font-size:.85rem;padding:12px;position:relative}
.video .play{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:1.3rem;margin-bottom:6px}
.card h3{font-size:1.05rem}
.card ul{margin:0;padding-left:18px}
.card li{margin:2px 0}
.fb{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
.fb button{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;padding:4px 10px;font:inherit;cursor:pointer}
.notice{display:flex;gap:10px;background:var(--warn-soft);color:var(--fg);border-radius:12px;padding:10px 12px;font-size:.85rem}
.notice.info{background:var(--accent-soft)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);

.tabs div{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:.75rem;font-weight:600;padding:10px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:1.25rem}

.sel{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.sel button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.sel button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.proto{font-size:.75rem;color:var(--muted);text-align:center;padding-block:8px}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.tile,.row,.topic{transition:border-color .15s}}
</style>

const count = (d, code) => { const c=d.content[code]; if(!c) return 0; if(Array.isArray(c)) return c.length; return Object.values(c).reduce((a,b)=>a+b.length,0); };
const countAll = d => TOPICS.reduce((a,tp)=>a+ (tp.code==="accessories"? d.acc.length : count(d,tp.code)),0);

function go(r, push=true){ if(push) hist.push(route); route=r; render(); window.scrollTo(0,0); }
function back(){ route = hist.pop() || {v:"home"}; render(); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function remember(slug){ recent=[slug,...recent.filter(s=>s!==slug)].slice(0,5); try{localStorage.setItem("howto.recent",JSON.stringify(recent));}catch(e){} }

// ---------- Nézetek ----------
function deviceRow(d){ return `<button class="row" data-dev="${d.slug}"><div class="img">${d.ic}</div><div class="t"><b>${esc(d.name)}</b><small>${esc(L(cat(d.cat).name))} · ${countAll(d)} ${t("videos")}/${t("articles")}</small></div><span class="chev">›</span></button>`; }

function viewHome(q=""){
  const ql=q.trim().toLowerCase();
  let html = `<div class="search"><span>⌕</span><input id="q" type="search" placeholder="${t("search")}" value="${esc(q)}" autocomplete="off"></div>`;
  if(ql){
    const hits = DEVICES.filter(d => d.name.toLowerCase().includes(ql) || L(cat(d.cat).name).toLowerCase().includes(ql) || d.acc.some(a=>L(ACC[a].name).toLowerCase().includes(ql)));
    html += `<div class="eyebrow">${t("results")}</div><div class="list">${hits.length? hits.map(deviceRow).join("") : `<div class="card">${t("noResult")}</div>`}</div>`;
  } else {
    html += `<div class="eyebrow">${t("cats")}</div><div class="grid">${CATS.map(c=>`<button class="tile" data-cat="${c.id}"><span class="ic">${c.ic}</span><b>${esc(L(c.name))}</b><small>${DEVICES.filter(d=>d.cat===c.id).length} ${t("devices").toLowerCase()}</small></button>`).join("")}</div>`;
    if(recent.length) html += `<div class="eyebrow">${t("recent")}</div><div class="list">${recent.map(s=>dev(s)).filter(Boolean).map(deviceRow).join("")}</div>`;
  }
  html += `<p class="proto">${t("proto")}</p>`;
  return {title:t("app"), html, back:false};
}
function viewCat(id){ const c=cat(id); const ds=DEVICES.filter(d=>d.cat===id);
  return {title:L(c.name), html:`<div class="eyebrow">${t("devices")}</div><div class="list">${ds.map(deviceRow).join("")}</div>`}; }
function viewRecent(){ const ds=recent.map(dev).filter(Boolean);
  return {title:t("tabRecent"), html: ds.length? `<div class="list">${ds.map(deviceRow).join("")}</div>` : `<div class="card">${t("empty")}</div>`, back:false}; }
function viewSettings(){
  return {title:t("settings"), back:false, html:`<div class="card"><b>${t("language")}</b><div class="sel"><button data-setlang="hu" aria-pressed="${lang==="hu"}">Magyar</button><button data-setlang="en" aria-pressed="${lang==="en"}">English</button><button disabled title="admin">+ …</button></div></div>
  <div class="card"><label style="display:flex;justify-content:space-between;align-items:center"><b>${t("data")}</b><input id="wifi" type="checkbox" checked></label></div>
  <div class="card"><b>${t("about")}</b><small class="meta">medimarket.hu · ${t("version")}</small></div>`}; }
function viewDevice(slug){ const d=dev(slug); remember(slug);
  const topics = TOPICS.map(tp=>{
    const n = tp.code==="accessories"? d.acc.length : count(d,tp.code);
    const empty = n===0;
    return `<button class="topic ${tp.risk?"risk":""} ${empty?"empty":""}" ${empty?"disabled":`data-topic="${tp.code}"`}><div class="n">${tp.n}</div><div class="t"><b>${esc(L(tp.name))}</b><small class="meta">${empty? t("soon") : esc(L(tp.desc))+" · "+n}</small></div><span class="chev">›</span></button>`;
  }).join("");
  return {title:d.name, html:`<div class="hero"><div class="img">${d.ic}</div><div class="t"><span class="pill">${esc(L(cat(d.cat).name))}</span><p>${esc(L(d.short))}</p><a class="btn" href="https://www.medimarket.hu/" target="_blank" rel="noopener">${t("shop")} ↗</a></div></div>
  <div class="eyebrow">${t("topics")}</div><div class="list">${topics}</div><div class="notice">⚠ ${t("ifu")}</div>`}; }
function accRow(slug, a){ const x=ACC[a]; return `<button class="row" data-acc="${a}" data-dev="${slug}"><div class="img">${x.ic}</div><div class="t"><b>${esc(L(x.name))} <span class="pill ${x.type==="standard"?"ok":""}">${t(x.type)}</span></b><small>${esc(L(x.fn))}</small></div><span class="chev">›</span></button>`; }
function viewTopic(slug, code, accSel){ const d=dev(slug); const tp=TOPICS.find(x=>x.code===code);
  let html="";
  if(code==="accessories"){ html = `<div class="list">${d.acc.map(a=>accRow(slug,a)).join("")}</div>`; }
  else if(code==="device_accessory_use"){
    const sel = accSel || d.acc[0];
    html = `<div class="eyebrow">${t("pick")}</div><div class="sel">${d.acc.map(a=>`<button data-sel="${a}" aria-pressed="${a===sel}">${ACC[a].ic} ${esc(L(ACC[a].name))}</button>`).join("")}</div>`;
    const items = (d.content.device_accessory_use||{})[sel]||[];
    html += items.length? items.map(contentCard).join("") : `<div class="card">${t("soon")}</div>`;
  } else { html = (d.content[code]||[]).map(contentCard).join(""); }
  if(tp.risk) html = `<div class="notice">⚠ ${t("ifu")}</div>`+html;
  return {title:L(tp.name), html}; }
function viewAcc(slug, a){ const x=ACC[a]; const others=DEVICES.filter(d=>d.slug!==slug && d.acc.includes(a));
  const items=((dev(slug).content.device_accessory_use||{})[a])||[];
  return {title:L(x.name), html:`<div class="hero"><div class="img">${x.ic}</div><div class="t"><span class="pill ${x.type==="standard"?"ok":""}">${t(x.type)}</span><p>${esc(L(x.fn))}</p><a class="btn" href="https://www.medimarket.hu/" target="_blank" rel="noopener">${t("shop")} ↗</a></div></div>
  ${items.map(contentCard).join("")}
  ${others.length? `<div class="card"><b>${t("compat")}</b><small class="meta">${others.map(o=>esc(o.name)).join(", ")}</small></div>`:""}`}; }
function contentCard(it){
  const fb = `<div class="fb">${t("useful")} <button data-fb>👍 ${t("yes")}</button><button data-fb>👎 ${t("no")}</button></div>`;
  if(it.kind==="video") return `<div class="card">${missing(it.title)?`<div class="notice info">ⓘ ${t("fallback")}</div>`:""}<div class="video"><div><div class="play" style="margin:0 auto 6px">▶</div>${t("video")}<br>${it.mins} min · <a href="https://www.youtube.com/" target="_blank" rel="noopener">${t("open")}</a></div></div><h3>${esc(L(it.title))}</h3>${fb}</div>`;
  const body = it.body && (it.body[lang] ?? it.body.hu); const fallback = it.body && it.body[lang]==null && lang!=="hu";
  return `<div class="card">${fallback?`<div class="notice info">ⓘ ${t("fallback")}</div>`:""}<h3>${esc(L(it.title))}</h3><ul>${(body||[]).map(b=>`<li>${esc(b)}</li>`).join("")}</ul>${fb}</div>`;
}

// ---------- Renderelés ----------
function render(){
  let v;
  switch(route.v){
    case "home": v=viewHome(route.q||""); break;
    case "cat": v=viewCat(route.id); break;
    case "recent": v=viewRecent(); break;
    case "settings": v=viewSettings(); break;
    case "device": v=viewDevice(route.slug); break;
    case "topic": v=viewTopic(route.slug, route.code, route.acc); break;
    case "acc": v=viewAcc(route.slug, route.acc); break;
    default: v=viewHome();
  }
  document.getElementById("title").textContent=v.title;
  document.getElementById("main").innerHTML=v.html;
  document.getElementById("back").hidden = v.back===false;
  document.getElementById("lang-hu").setAttribute("aria-pressed", lang==="hu");
  document.getElementById("lang-en").setAttribute("aria-pressed", lang==="en");
  ["search","recent","settings"].forEach(k=>{ const b=document.getElementById("tab-"+k); b.setAttribute("aria-current", (k==="search"? !["recent","settings"].includes(route.v) : route.v===k) ? "page":"false"); document.getElementById("tab-"+k+"-l").textContent=t("tab"+k[0].toUpperCase()+k.slice(1)); });
  document.title = "HowToUse Prototípus";
  const q=document.getElementById("q"); if(q){ q.addEventListener("input", e=>{ route={v:"home", q:e.target.value}; const h=viewHome(route.q); document.getElementById("main").innerHTML=h.html; const q2=document.getElementById("q"); q2.focus(); q2.setSelectionRange(q2.value.length,q2.value.length); bindMain(); }); }
  bindMain();
}
function bindMain(){
  const m=document.getElementById("main");
  m.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>go({v:"cat", id:b.dataset.cat}));
  m.querySelectorAll("[data-dev]:not([data-acc])").forEach(b=>b.onclick=()=>go({v:"device", slug:b.dataset.dev}));
  m.querySelectorAll("[data-acc][data-dev]").forEach(b=>b.onclick=()=>go({v:"acc", slug:b.dataset.dev, acc:b.dataset.acc}));
  m.querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>go({v:"topic", slug:route.slug, code:b.dataset.topic}));
  m.querySelectorAll("[data-sel]").forEach(b=>b.onclick=()=>{ route={...route, acc:b.dataset.sel}; render(); });
  m.querySelectorAll("[data-setlang]").forEach(b=>b.onclick=()=>setLang(b.dataset.setlang));
  m.querySelectorAll("[data-fb]").forEach(b=>b.onclick=()=>{ b.parentElement.textContent=t("thanks"); });
}
function setLang(l){ lang=l; try{localStorage.setItem("howto.lang",l);}catch(e){} render(); }
document.getElementById("back").onclick=back;
document.getElementById("lang-hu").onclick=()=>setLang("hu");
document.getElementById("lang-en").onclick=()=>setLang("en");
document.getElementById("tab-search").onclick=()=>{hist=[];go({v:"home"},false)};
document.getElementById("tab-recent").onclick=()=>{hist=[];go({v:"recent"},false)};
document.getElementById("tab-settings").onclick=()=>{hist=[];go({v:"settings"},false)};
render();
</script>
