<meta charset="utf-8">
<title>HowToUse Prototípus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: egyoszlopos mobil nézet, max 440px széles "telefon" oszlop; alsó tabsor; nézetek hash nélkül, belső állapottal.
   Adatok: data/products.json – az UNAS getProduct válaszokból (docs/samples) kinyert valós tartalom, 5 nyelven. */
:root{
  --bg:#f3f6f8; --surface:#ffffff; --fg:#13222b; --muted:#5b6b75; --line:#d9e1e6;
  --accent:#0f7c8c; --accent-fg:#ffffff; --accent-soft:#dff2f4;
  --warn:#b3561a; --warn-soft:#fbeadb; --ok:#2e7d4f; --ok-soft:#e2f3e8;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-head:"Space Grotesk","Inter",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171c; --surface:#172229; --fg:#e8eef2; --muted:#98a8b2; --line:#2a3842;
  --accent:#4fc1d0; --accent-fg:#06252b; --accent-soft:#143a41;
  --warn:#f0a062; --warn-soft:#3b2a1a; --ok:#6fcf97; --ok-soft:#173526; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171c; --surface:#172229; --fg:#e8eef2; --muted:#98a8b2; --line:#2a3842;
  --accent:#4fc1d0; --accent-fg:#06252b; --accent-soft:#143a41;
  --warn:#f0a062; --warn-soft:#3b2a1a; --ok:#6fcf97; --ok-soft:#173526; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--font-head);text-wrap:balance;margin:0;line-height:1.2}
.app{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px 8px}
.top h1{font-size:1.15rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;width:40px;height:40px;font-size:1.2rem;cursor:pointer;flex:none}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.lang button{border:0;background:var(--surface);color:var(--muted);padding:8px 7px;font:inherit;font-size:.75rem;font-weight:600;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
main{flex:1;padding-bottom:88px;display:flex;flex-direction:column;gap:16px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;outline:none}
.search input:focus-visible{outline:2px solid var(--accent);border-radius:4px}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;color:var(--fg);font:inherit;min-height:96px}
.tile:hover,.row:hover,.topic:hover{border-color:var(--accent)}
.tile .ic{font-size:1.5rem;line-height:1}
.tile b{font-size:.95rem}
.tile small,.row small,.meta{color:var(--muted);font-size:.8rem}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;color:var(--fg);font:inherit;text-align:left;width:100%}
.row .img{width:54px;height:54px;border-radius:10px;background:#fff;display:grid;place-items:center;font-size:1.4rem;flex:none;overflow:hidden;border:1px solid var(--line)}
.row .img img,.hero .img img{width:100%;height:100%;object-fit:contain;display:block}
.row .t{flex:1;min-width:0}
.row b{display:block}
.chev{color:var(--muted)}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:14px}
.hero .img{width:104px;height:104px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:2.4rem;flex:none;overflow:hidden;border:1px solid var(--line)}
.hero .t{min-width:0;flex:1}
.hero p{margin:4px 0 8px;font-size:.9rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:10px;padding:6px 10px;font:inherit;font-size:.85rem;font-weight:600;text-decoration:none;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.topic{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;color:var(--fg);font:inherit;text-align:left;width:100%}
.topic .n{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-family:var(--font-head);flex:none}
.topic.risk .n{background:var(--warn-soft);color:var(--warn)}
.topic .t{flex:1;min-width:0}
.topic .t b{display:block}
.topic.empty{opacity:.55;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.card h3{font-size:1rem}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.card p{margin:0;font-size:.92rem}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.72rem;font-weight:600;background:var(--accent-soft);color:var(--accent);vertical-align:middle;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:.85rem;font-weight:500}
.notice.info{background:var(--accent-soft);color:var(--accent)}
.step{display:flex;gap:12px}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none;font-family:var(--font-head)}
.step .t{min-width:0;flex:1}
.step b{display:block;font-size:.95rem}
.step p{color:var(--muted)}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 14px}
details summary{padding:12px 0;font-weight:600;cursor:pointer;font-size:.95rem;list-style:none;display:flex;gap:8px;align-items:flex-start}
details summary::before{content:"+";color:var(--accent);font-family:var(--font-head);font-weight:700;flex:none}
details[open] summary::before{content:"–"}
details p{margin:0 0 12px;font-size:.92rem;color:var(--muted)}
.sel{display:flex;flex-wrap:wrap;gap:6px}
.sel button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.sel button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.vid{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-decoration:none;color:var(--fg)}
.vid:hover{border-color:var(--accent)}
.vid .th{width:120px;aspect-ratio:16/9;max-width:100%;border-radius:8px;overflow:hidden;background:var(--accent-soft);flex:none;position:relative;display:grid;place-items:center}
.vid .th img{width:100%;height:100%;object-fit:cover;display:block}
.vid .th .play{position:absolute;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:.8rem}
.vid .t{min-width:0;flex:1}
.vid b{display:block;font-size:.9rem;line-height:1.3}
.vid small{color:var(--muted);font-size:.78rem}
.fb{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted);margin-top:4px}
.fb button{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;padding:4px 8px;font:inherit;font-size:.85rem;cursor:pointer}
.proto{font-size:.78rem;color:var(--muted);text-align:center;margin:8px 0 0}
.src{font-size:.75rem;color:var(--muted)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs>div{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:.72rem;font-weight:600;padding:8px 0 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:1.25rem;line-height:1}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs em{font-style:normal}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.tile,.row,.topic{transition:border-color .15s}}
</style>

      pkg:"Inhoud van de verpakking", modes:"Behandelmodi", ind:"Aanbevolen bij", forwho:"Klachten waarvoor de webshop het aanbiedt", hidden:"Dit apparaat is niet beschikbaar in deze taal.",
      src:"Bron: UNAS-productbeschrijving", stepsTitle:"Stap voor stap", contraTitle:"Wanneer niet gebruiken", warnTitle:"Medische waarschuwing",
      t_intro:"Overzicht", d_intro:"Waarvoor het is, wat er in de doos zit", t_acc:"Compatibele accessoires", d_acc:"In UNAS gekoppelde producten",
      t_steps:"Gebruik stap voor stap", d_steps:"Voorbereiding, plaatsing, behandeling", t_pair:"Apparaat + accessoire", d_pair:"Kies een accessoire",
      t_faq:"Veelgestelde vragen", d_faq:"Uit de webshopbeschrijving", t_risk:"Risico's", d_risk:"Wanneer gebruik verboden is of voorzichtigheid vraagt", t_mist:"Veelgemaakte fouten", d_mist:"Typische gebruikersfouten"}
};
const TOPICS = [
  {code:"intro", n:"1", t:"t_intro", d:"d_intro"},
  {code:"accessories", n:"2", t:"t_acc", d:"d_acc"},
  {code:"steps", n:"3", t:"t_steps", d:"d_steps"},
  {code:"pair", n:"4", t:"t_pair", d:"d_pair"},
  {code:"faq", n:"5", t:"t_faq", d:"d_faq"},
  {code:"risks", n:"!", t:"t_risk", d:"d_risk", risk:true},
  {code:"mistakes", n:"6", t:"t_mist", d:"d_mist"},
];
const ICON = {"Elektromos kezelés":"⚡","Nyirokmasszázs gép":"≋","Rehabilitációs eszközök":"✚","Mágnesterápiás készülék":"◎","Lágylézer készülék":"✦","Terápiás lézer":"✦","Terápiás ultrahang":"◍","Kozmetikai ultrahang":"◍","Sóterápiás készülék":"☁","Légút tisztító készülék":"☁","Masszázs pisztoly":"⌁","Inkontinencia kezelése":"◌","Pénisz pumpa":"◌","Férfi intim problémák":"◌","Fájdalomkezelés":"✚","Rádiófrekvenciás készülék":"◍","Ránckezelés":"❋"};

// ---------- Állapot ----------
let DEVICES = [], lang = "hu", route = {v:"home"}, recent = [], hist = [];
try{ lang = localStorage.getItem("howto.lang") || "hu"; recent = JSON.parse(localStorage.getItem("howto.recent")||"[]"); }catch(e){}
if(!LANGS.includes(lang)) lang="hu";
const t = k => UI[lang][k] ?? UI.hu[k] ?? k;
const L = obj => obj && (obj[lang] ?? obj.hu);
const missing = obj => obj && obj[lang]==null && lang!=="hu";
const dev = slug => DEVICES.find(d=>d.slug===slug);
const visible = () => DEVICES.filter(d=>!d.hidden.includes(lang));
const baseCat = d => { const c=(L(d.cats)||[])[0]||""; return c.split("|").pop(); };
const catKey = d => { const s=(d.cats.hu[0]||"").split("|"); return s[1]||s[0]; };
const groupName = d => { const s=((L(d.cats)||[])[0]||"").split("|"); return s[1]||s[0]; };
const symptomCats = d => (L(d.cats)||[]).slice(1).map(c=>c.split("|").pop());
const vidsFor = (d, topic) => { const all=(d.videos||[]).filter(v=>v.topic===topic); const own=all.filter(v=>v.lang===lang||v.lang==="all"); return own.length? own : all.filter(v=>v.lang==="hu"); };
const nVid = (d, topic) => vidsFor(d,topic).length;
function videoCards(d, topic){ const vs=vidsFor(d,topic); if(!vs.length) return "";
  return `<div class="eyebrow">${t("videos")}</div>`+vs.map(v=>`<a class="vid" href="${esc(v.url)}" target="_blank" rel="noopener"><div class="th">${v.thumb?`<img src="${esc(v.thumb)}" alt="" loading="lazy">`:""}<span class="play">▶</span></div><div class="t"><b>${esc(v.title)}</b><small>${v.src==="vimeo"? t("openVimeo") : t("openYt")} ↗${v.lang==="all"?"":" · "+v.lang.toUpperCase()}${v.unas?" · "+t("unasVid"):""}</small></div></a>`).join("");
}
const nonEmpty = (d, code) => {
  switch(code){
    case "intro": return 1 + nVid(d,"intro");
    case "accessories": return d.acc.length;
    case "steps": return (L(d.steps)||[]).length + nVid(d,"steps");
    case "faq": return (L(d.faq)||[]).length + nVid(d,"faq");
    case "risks": { const c=L(d.contra); return (c? c.items.length:0) + (L(d.warn)?1:0) + nVid(d,"risks"); }
    default: return 0;
  }
};
function go(r, push=true){ if(push) hist.push(route); route=r; render(); window.scrollTo(0,0); }
function back(){ route = hist.pop() || {v:"home"}; render(); }
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function remember(slug){ recent=[slug,...recent.filter(s=>s!==slug)].slice(0,5); try{localStorage.setItem("howto.recent",JSON.stringify(recent));}catch(e){} }
function setLang(l){ lang=l; try{localStorage.setItem("howto.lang",l);}catch(e){} render(); }

// ---------- Nézetek ----------
function img(d, cls){ return `<div class="img"><img src="${d.img}" alt="${esc(L(d.name))}" loading="lazy"></div>`; }
function deviceRow(d){ return `<button class="row" data-dev="${d.slug}">${img(d)}<div class="t"><b>${esc(L(d.name))}</b><small>${esc(baseCat(d))}${d.brand&&d.brand!=="n/a"?" · "+esc(d.brand):""}</small></div><span class="chev">›</span></button>`; }

function viewHome(q=""){
  const ql=q.trim().toLowerCase(); const ds=visible();
  let html = `<div class="search"><span>⌕</span><input id="q" type="search" placeholder="${t("search")}" value="${esc(q)}" autocomplete="off"></div>`;
  if(ql){
    const hits = ds.filter(d => L(d.name).toLowerCase().includes(ql) || (L(d.cats)||[]).join(" ").toLowerCase().includes(ql) || d.acc.some(a=>(L(a.name)||"").toLowerCase().includes(ql)) || d.sku.toLowerCase().includes(ql));
    html += `<div class="eyebrow">${t("results")}</div><div class="list">${hits.length? hits.map(deviceRow).join("") : `<div class="card">${t("noResult")}</div>`}</div>`;
  } else {
    const cats = [...new Map(ds.map(d=>[catKey(d), {key:catKey(d), name:groupName(d), ic:ICON[catKey(d)]||"◦", n:ds.filter(x=>catKey(x)===catKey(d)).length}])).values()].sort((a,b)=>b.n-a.n);
    html += `<div class="eyebrow">${t("cats")}</div><div class="grid">${cats.map(c=>`<button class="tile" data-cat="${esc(c.key)}"><span class="ic">${c.ic}</span><b>${esc(c.name)}</b><small>${c.n} ${t("devices")}</small></button>`).join("")}</div>`;
    const rec = recent.map(dev).filter(d=>d && !d.hidden.includes(lang));
    if(rec.length) html += `<div class="eyebrow">${t("recent")}</div><div class="list">${rec.map(deviceRow).join("")}</div>`;
  }
  html += `<p class="proto">${t("proto")}</p>`;
  return {title:t("app"), html, back:false};
}
function viewCat(key){ const ds=visible().filter(d=>catKey(d)===key).sort((a,b)=>baseCat(a).localeCompare(baseCat(b))||L(a.name).localeCompare(L(b.name))); const name=ds.length? groupName(ds[0]) : key;
  return {title:name, html:`<div class="list">${ds.map(deviceRow).join("")}</div>`}; }
function viewRecent(){ const ds=recent.map(dev).filter(d=>d && !d.hidden.includes(lang));
  return {title:t("tabRecent"), html: ds.length? `<div class="list">${ds.map(deviceRow).join("")}</div>` : `<div class="card">${t("empty")}</div>`, back:false}; }
function viewSettings(){
  const names={hu:"Magyar",en:"English",sk:"Slovenčina",de:"Deutsch",nl:"Nederlands"};
  return {title:t("settings"), back:false, html:`<div class="card"><b>${t("language")}</b><div class="sel">${LANGS.map(l=>`<button data-setlang="${l}" aria-pressed="${lang===l}">${names[l]}</button>`).join("")}</div></div>
  <div class="card"><label style="display:flex;justify-content:space-between;align-items:center"><b>${t("data")}</b><input id="wifi" type="checkbox" checked></label></div>
  <div class="card"><b>${t("about")}</b><small class="meta">medimarket.hu · ${t("version")}</small></div>`}; }
function viewDevice(slug){ const d=dev(slug); remember(slug);
  if(d.hidden.includes(lang)) return {title:L(d.name), html:`<div class="notice">${t("hidden")}</div>`};
  const topics = TOPICS.map(tp=>{
    const n = nonEmpty(d,tp.code); const empty = n===0;
    return `<button class="topic ${tp.risk?"risk":""} ${empty?"empty":""}" ${empty?"disabled":`data-topic="${tp.code}"`}><div class="n">${tp.n}</div><div class="t"><b>${esc(t(tp.t))}</b><small class="meta">${empty? t("soon") : esc(t(tp.d))+(tp.code==="intro"?"":" · "+n)}</small></div><span class="chev">›</span></button>`;
  }).join("");
  const sym = symptomCats(d);
  return {title:L(d.name), html:`<div class="hero">${img(d)}<div class="t"><span class="pill">${esc(baseCat(d))}</span>${d.professional_only?` <span class="pill warn">${t("prof")}</span>`:""}<p>${esc(L(d.short))}</p>
  <div class="btns"><a class="btn" href="${esc(L(d.url))}" target="_blank" rel="noopener">${t("shop")} ↗</a>${L(d.manual)?`<a class="btn primary" href="${esc(L(d.manual))}" target="_blank" rel="noopener">PDF ↗</a>`:""}</div></div></div>
  ${sym.length?`<div><div class="eyebrow" style="margin-bottom:6px">${t("forwho")}</div><div class="pills">${sym.map(s=>`<span class="pill">${esc(s)}</span>`).join("")}</div></div>`:""}
  <div class="eyebrow">${t("topics")}</div><div class="list">${topics}</div><div class="notice">⚠ ${t("ifu")}</div>`}; }

function fb(){ return `<div class="fb">${t("useful")} <button data-fb>👍 ${t("yes")}</button><button data-fb>👎 ${t("no")}</button></div>`; }
function fallbackNote(obj){ return missing(obj)?`<div class="notice info">ⓘ ${t("fallback")}</div>`:""; }

function viewIntro(d){
  const pk=L(d.pkg); let html=`<div class="card"><p>${esc(L(d.short))}</p>${d.modes.length?`<div><span class="eyebrow">${t("modes")}</span><div class="pills" style="margin-top:4px">${d.modes.map(m=>`<span class="pill">${esc(m)}</span>`).join("")}</div></div>`:""}${d.ind.length?`<div><span class="eyebrow">${t("ind")}</span><div class="pills" style="margin-top:4px">${d.ind.map(m=>`<span class="pill ok">${esc(m)}</span>`).join("")}</div></div>`:""}</div>`;
  if(pk && pk.items.length) html+=`<div class="card">${fallbackNote(d.pkg)}<h3>${esc(pk.title||t("pkg"))}</h3><ul>${pk.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul><span class="src">${t("src")}</span>${fb()}</div>`;
  if(L(d.manual)) html+=`<a class="btn primary" href="${esc(L(d.manual))}" target="_blank" rel="noopener">${t("manual")} ↗</a>`;
  return videoCards(d,"intro")+html;
}
function accRow(slug, a){ return `<button class="row" data-acc="${esc(a.sku)}" data-dev="${slug}"><div class="img">▭</div><div class="t"><b>${esc(L(a.name))} <span class="pill">${t("acc")}</span></b><small>SKU ${esc(a.sku)}</small></div><span class="chev">›</span></button>`; }
function viewAccList(d){ return `<div class="notice info">${t("compat")}</div><div class="list">${d.acc.map(a=>accRow(d.slug,a)).join("")}</div>`; }
function viewSteps(d){ const st=L(d.steps)||[];
  return videoCards(d,"steps")+`<div class="card">${fallbackNote(d.steps)}<h3>${t("stepsTitle")}</h3>${st.map((s,i)=>`<div class="step"><div class="n">${i+1}</div><div class="t"><b>${esc(s.t||"")}</b><p>${esc(s.b)}</p></div></div>`).join("")}<span class="src">${t("src")}</span>${fb()}</div>`; }
function viewFaq(d){ const f=L(d.faq)||[]; return videoCards(d,"faq")+fallbackNote(d.faq)+f.map(x=>`<details><summary>${esc(x.q)}</summary><p>${esc(x.a)}</p></details>`).join("")+`<span class="src">${t("src")}</span>`; }
function viewRisks(d){ const c=L(d.contra); const w=L(d.warn); let html=`<div class="notice">⚠ ${t("ifu")}</div>`;
  if(c) html+=`<div class="card">${fallbackNote(d.contra)}<h3>${esc(c.title||t("contraTitle"))}</h3><ul>${c.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul><span class="src">${t("src")} · schema.org/MedicalContraindication</span>${fb()}</div>`;
  if(w) html+=`<div class="card"><h3>${t("warnTitle")}</h3><p>${esc(w)}</p></div>`;
  return html+videoCards(d,"risks"); }
function viewTopic(slug, code){ const d=dev(slug); const tp=TOPICS.find(x=>x.code===code); let html="";
  switch(code){ case "intro": html=viewIntro(d); break; case "accessories": html=viewAccList(d); break; case "steps": html=viewSteps(d); break;
    case "faq": html=viewFaq(d); break; case "risks": html=viewRisks(d); break; default: html=`<div class="card">${t("soon")}</div>`; }
  return {title:t(tp.t), html}; }
function viewAcc(slug, sku){ const d=dev(slug); const a=d.acc.find(x=>x.sku===sku); const others=visible().filter(o=>o.slug!==slug && o.acc.some(x=>x.sku===sku));
  return {title:L(a.name), html:`<div class="hero"><div class="img">▭</div><div class="t"><span class="pill">${t("acc")}</span><p>${esc(L(a.name))}<br><small class="meta">SKU ${esc(a.sku)}</small></p><a class="btn" href="${esc(L(a.url)||L(d.url))}" target="_blank" rel="noopener">${t("shop")} ↗</a></div></div>
  <div class="card">${t("soon")}</div>
  ${others.length? `<div class="card"><b>${t("also")}</b><small class="meta">${others.map(o=>esc(L(o.name))).join(", ")}</small></div>`:""}`}; }

// ---------- Renderelés ----------
function render(){
  let v;
  switch(route.v){
    case "home": v=viewHome(route.q||""); break;
    case "cat": v=viewCat(route.id); break;
    case "recent": v=viewRecent(); break;
    case "settings": v=viewSettings(); break;
    case "device": v=viewDevice(route.slug); break;
    case "topic": v=viewTopic(route.slug, route.code); break;
    case "acc": v=viewAcc(route.slug, route.acc); break;
    default: v=viewHome();
  }
  document.getElementById("title").textContent=v.title;
  document.getElementById("main").innerHTML=v.html;
  document.getElementById("back").hidden = v.back===false;
  document.getElementById("langbar").innerHTML = LANGS.map(l=>`<button data-lang="${l}" aria-pressed="${lang===l}">${l.toUpperCase()}</button>`).join("");
  document.querySelectorAll("#langbar [data-lang]").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
  ["search","recent","settings"].forEach(k=>{ const b=document.getElementById("tab-"+k); b.setAttribute("aria-current", (k==="search"? !["recent","settings"].includes(route.v) : route.v===k) ? "page":"false"); document.getElementById("tab-"+k+"-l").textContent=t("tab"+k[0].toUpperCase()+k.slice(1)); });
  const q=document.getElementById("q"); if(q){ q.addEventListener("input", e=>{ route={v:"home", q:e.target.value}; const h=viewHome(route.q); document.getElementById("main").innerHTML=h.html; const q2=document.getElementById("q"); q2.focus(); q2.setSelectionRange(q2.value.length,q2.value.length); bindMain(); }); }
  bindMain();
}
function bindMain(){
  const m=document.getElementById("main");
  m.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>go({v:"cat", id:b.dataset.cat}));
  m.querySelectorAll("[data-dev]:not([data-acc])").forEach(b=>b.onclick=()=>go({v:"device", slug:b.dataset.dev}));
  m.querySelectorAll("[data-acc][data-dev]").forEach(b=>b.onclick=()=>go({v:"acc", slug:b.dataset.dev, acc:b.dataset.acc}));
  m.querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>go({v:"topic", slug:route.slug, code:b.dataset.topic}));
  m.querySelectorAll("[data-setlang]").forEach(b=>b.onclick=()=>setLang(b.dataset.setlang));
  m.querySelectorAll("[data-fb]").forEach(b=>b.onclick=()=>{ b.parentElement.textContent=t("thanks"); });
}
document.getElementById("back").onclick=back;
document.getElementById("tab-search").onclick=()=>{ hist=[]; route={v:"home"}; render(); };
document.getElementById("tab-recent").onclick=()=>{ hist=[]; route={v:"recent"}; render(); };
document.getElementById("tab-settings").onclick=()=>{ hist=[]; route={v:"settings"}; render(); };

fetch("data/products.json").then(r=>r.json()).then(data=>{ DEVICES=data; render(); })
  .catch(err=>{ document.getElementById("main").innerHTML=`<div class="notice">Az adatfájl (data/products.json) nem tölthető be: ${esc(err.message)}</div>`; });
</script>
